<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.7;color:#333}
        .container{max-width:960px;margin:0 auto;padding:0 1.5rem}
        header{background:#1a1a2e;color:#fff;padding:1rem 0}
        header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem}
        header h1{font-size:1.3rem}
        header h1 a{color:#fff;text-decoration:none}
        nav a{color:#ccc;text-decoration:none;margin-left:1.2rem;font-size:0.9rem}
        nav a:hover{color:#fff}
        main{padding:2rem 0;min-height:60vh}
        h1{margin-bottom:1rem;color:#1a1a2e}
        h2{margin:1.5rem 0 0.75rem;color:#16213e}
        h3{margin:1.2rem 0 0.5rem}
        p{margin-bottom:0.8rem}
        ul,ol{margin:0.5rem 0 1rem 1.5rem}
        li{margin-bottom:0.3rem}
        code{background:#f4f4f4;padding:0.15rem 0.4rem;border-radius:3px;font-size:0.9em}
        pre{background:#f4f4f4;padding:1rem;border-radius:6px;overflow-x:auto;margin:1rem 0}
        pre code{background:none;padding:0}
        table{border-collapse:collapse;width:100%;margin:1rem 0}
        th,td{border:1px solid #ddd;padding:0.5rem 0.75rem;text-align:left}
        th{background:#f8f9fa}
        footer{border-top:1px solid #eee;padding:1.5rem 0;text-align:center;color:#888;font-size:0.85rem;margin-top:2rem}
    </style>
</head>
